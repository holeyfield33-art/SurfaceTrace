services:
  surfacetrace:
    build:
      context: .
      dockerfile: Dockerfile
    command: bash scripts/container-start.sh
    init: true
    working_dir: /workspace/SurfaceTrace
    volumes:
      - .:/workspace/SurfaceTrace
      - surfacetrace-node-modules:/workspace/SurfaceTrace/node_modules
      - surfacetrace-core-node-modules:/workspace/SurfaceTrace/packages/core/node_modules
      - surfacetrace-server-node-modules:/workspace/SurfaceTrace/packages/server/node_modules
      - surfacetrace-web-node-modules:/workspace/SurfaceTrace/packages/web/node_modules
      - surfacetrace-data:/workspace/SurfaceTrace/data
    ports:
      - "127.0.0.1:5173:5173"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent http://127.0.0.1:8787/health >/dev/null &&
          curl --fail --silent http://127.0.0.1:5173/ >/dev/null &&
          curl --fail --silent http://127.0.0.1:4040/ >/dev/null
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    environment:
      PORT: "8787"
      HOST: "127.0.0.1"
      SURFACETRACE_WEB_HOST: "0.0.0.0"
      CODESPACE_NAME: "${CODESPACE_NAME:-}"
      GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: "${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-app.github.dev}"
      MAX_HAR_BODY_BYTES: "10485760"
      MAX_HAR_ENTRIES: "5000"
      CORS_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173"
      SURFACETRACE_DB_PATH: "/workspace/SurfaceTrace/data/surfacetrace.db"
      npm_config_update_notifier: "false"
      npm_config_fund: "false"
      npm_config_audit: "false"
volumes:
  surfacetrace-node-modules:
  surfacetrace-core-node-modules:
  surfacetrace-server-node-modules:
  surfacetrace-web-node-modules:
  surfacetrace-data:
