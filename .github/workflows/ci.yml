name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser-e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  container-smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and start the development container
        env:
          CODESPACE_NAME: ci-surface
          GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: app.github.dev
        run: docker compose up --detach --build
      - name: Wait for the container health gate
        run: |
          container_id="$(docker compose ps --all -q surfacetrace)"
          if [ -z "$container_id" ]; then
            docker compose logs
            exit 1
          fi
          for attempt in {1..36}; do
            state="$(docker inspect --format='{{.State.Status}}' "$container_id")"
            if [ "$state" != "running" ]; then
              docker compose logs
              exit 1
            fi
            health="$(docker inspect --format='{{.State.Health.Status}}' "$container_id")"
            if [ "$health" = "healthy" ]; then
              exit 0
            fi
            if [ "$health" = "unhealthy" ]; then
              docker compose logs
              exit 1
            fi
            sleep 5
          done
          docker compose logs
          exit 1
      - name: Verify Docker and Codespaces-style entry points
        run: |
          curl --fail --silent --show-error http://127.0.0.1:5173/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:5173/api/health | grep '"ok":true'
          curl --fail --silent --show-error http://127.0.0.1:5173/lab/projects/100 | grep '"id":100'
          curl --fail --silent --show-error --header 'Host: ci-surface-5173.app.github.dev' http://127.0.0.1:5173/ >/dev/null
          docker compose exec --no-TTY surfacetrace curl --fail --silent http://127.0.0.1:8787/health | grep '"ok":true'
          docker compose exec --no-TTY surfacetrace curl --fail --silent http://127.0.0.1:4040/ | grep '"ok":true'
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop development container
        if: always()
        run: docker compose down --volumes
